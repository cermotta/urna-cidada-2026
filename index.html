<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Urna Eletrônica 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Rawline:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --urna-body: #d1d5db;
      --urna-border: #9ca3af;
      --screen-bg: #edf2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      min-height: 100vh;
    }

    /* Topo / Header */
    .header-title {
      text-align: center;
      margin-bottom: 10px;
    }
    .header-title h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-title p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    /* Seletor do Estado */
    .seletor-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      flex-wrap: wrap;
    }
    .seletor-card label {
      font-weight: 600;
      font-size: 15px;
      color: #e2e8f0;
    }
    .seletor-card select {
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .seletor-card select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    /* Estrutura da Urna */
    .urna-container {
      background: linear-gradient(145deg, #e2e8f0, #cbd5e1);
      border: 2px solid #94a3b8;
      border-radius: 16px;
      padding: 28px;
      display: flex;
      gap: 28px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.8);
      flex-wrap: wrap;
    }

    /* Tela da Urna */
    .tela-container {
      flex: 1.3;
      background-color: var(--screen-bg);
      border: 3px solid #64748b;
      border-radius: 10px;
      padding: 20px;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      color: #0f172a;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
    }

    .tela-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      letter-spacing: 0.5px;
    }

    .cargo-titulo {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
      margin-bottom: 15px;
      color: #0f172a;
    }

    .foto-candidato {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 110px;
      height: 135px;
      border: 2px solid #0f172a;
      border-radius: 4px;
      background-color: #cbd5e1;
      background-size: cover;
      background-position: center;
      display: none;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .digitos-box { display: flex; gap: 8px; margin: 15px 0; }
    .digito {
      width: 42px;
      height: 52px;
      border: 2px solid #0f172a;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      background: #fff;
    }

    .info-candidato {
      font-size: 16px;
      line-height: 1.6;
      color: #1e293b;
      margin-top: 10px;
    }

    .instrucoes {
      border-top: 2px solid #cbd5e1;
      padding-top: 10px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }

    /* Teclado da Urna */
    .teclado-container {
      flex: 0.9;
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    
    .teclado-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .teclado-numerico {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-num {
      background: linear-gradient(180deg, #2a374a, #111827);
      color: #fff;
      border: 1px solid #374151;
      padding: 14px;
      font-size: 22px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s ease;
    }
    .btn-num:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .teclado-acoes {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-acao {
      flex: 1;
      padding: 14px 4px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.1s ease;
    }
    .btn-acao:active { transform: translateY(2px); }

    .btn-branco { background: linear-gradient(180deg, #ffffff, #e2e8f0); color: #0f172a; box-shadow: 0 3px 0 #94a3b8; }
    .btn-corrige { background: linear-gradient(180deg, #fb923c, #ea580c); color: #fff; box-shadow: 0 3px 0 #9a3412; }
    .btn-confirma { background: linear-gradient(180deg, #4ade80, #16a34a); color: #fff; box-shadow: 0 3px 0 #14532d; font-size: 12px; }

    /* Painel de Apuração */
    .painel-apuracao {
      background: var(--card-bg);
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 900px;
    }

    .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .painel-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }

    .candidato-linha {
      margin-bottom: 18px;
    }

      display: flex;
      justify-content: space-between;
      font-size:
