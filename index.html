<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urna Cidadã 2026 - Simulador e Pesquisa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --screen-bg: #edf2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background: var(--bg-color);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      min-height: 100vh;
    }

    /* Cabeçalho e Logo */
    .header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .logo-svg {
      max-width: 100%;
      height: auto;
    }

    .header-sub {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Seletor do Estado */
    .seletor-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      flex-wrap: wrap;
    }
    .seletor-card label {
      font-weight: 600;
      font-size: 15px;
      color: #e2e8f0;
    }
    .seletor-card select {
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .seletor-card select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    /* Estrutura da Urna */
    .urna-container {
      background: linear-gradient(145deg, #e2e8f0, #cbd5e1);
      border: 2px solid #94a3b8;
      border-radius: 16px;
      padding: 28px;
      display: flex;
      gap: 28px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.8);
      flex-wrap: wrap;
    }

    /* Tela da Urna */
    .tela-container {
      flex: 1.3;
      background-color: var(--screen-bg);
      border: 3px solid #64748b;
      border-radius: 10px;
      padding: 20px;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      color: #0f172a;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
    }

    .tela-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      letter-spacing: 0.5px;
    }

    .cargo-titulo {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
      margin-bottom: 15px;
      color: #0f172a;
    }

    /* Moldura da Foto do Candidato */
    .foto-candidato {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 110px;
      height: 135px;
      border: 2px solid #0f172a;
      border-radius: 4px;
      background-color: #ffffff;
      display: none;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .foto-candidato img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .digitos-box { display: flex; gap: 8px; margin: 15px 0; }
    .digito {
      width: 42px;
      height: 52px;
      border: 2px solid #0f172a;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      background: #fff;
    }

    .info-candidato {
      font-size: 16px;
      line-height: 1.6;
      color: #1e293b;
      margin-top: 10px;
    }

    .instrucoes {
      border-top: 2px solid #cbd5e1;
      padding-top: 10px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }

    /* Teclado da Urna */
    .teclado-container {
      flex: 0.9;
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    
    .teclado-header {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .teclado-numerico {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-num {
      background: linear-gradient(180deg, #2a374a, #111827);
      color: #fff;
      border: 1px solid #374151;
      padding: 14px;
      font-size: 22px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s ease;
    }
    .btn-num:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #000;
    }

    .teclado-acoes {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-acao {
      flex: 1;
      padding: 14px 4px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.1s ease;
    }
    .btn-acao:active { transform: translateY(2px); }

    .btn-branco { background: linear-gradient(180deg, #ffffff, #e2e8f0); color: #0f172a; box-shadow: 0 3px 0 #94a3b8; }
    .btn-corrige { background: linear-gradient(180deg, #fb923c, #ea580c); color: #fff; box-shadow: 0 3px 0 #9a3412; }
    .btn-confirma { background: linear-gradient(180deg, #4ade80, #16a34a); color: #fff; box-shadow: 0 3px 0 #14532d; font-size: 12px; }

    /* Painel de Apuração */
    .painel-apuracao {
      background: var(--card-bg);
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 900px;
    }

    .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .painel-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }

    .candidato-linha {
      margin-bottom: 18px;
    }

    .candidato-info-flex {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .barra-bg {
      background: #0f172a;
      height: 16px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .barra-fill {
      height: 100%;
      border-radius: 20px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fill-flavio { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .fill-lula { background: linear-gradient(90deg, #ef4444, #f87171); }

    .fim-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho com a Logo Urna Cidadã 2026 -->
  <div class="header-container">
    <svg class="logo-svg" width="280" height="65" viewBox="0 0 280 65" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="8" width="50" height="50" rx="12" fill="url(#logo_gradiente)"/>
      <rect x="15" y="19" width="30" height="22" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <rect x="19" y="23" width="12" height="14" rx="1" fill="#22C55E"/>
      <circle cx="37" cy="26" r="2" fill="#F97316"/>
      <circle cx="37" cy="32" r="2" fill="#3B82F6"/>
      <path d="M22 30L24 32L28 26" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="68" y="36" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">
        Urna<tspan fill="#38BDF8">Cidadã</tspan>
      </text>
      <text x="68" y="50" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="2">
        SIMULADOR 2026
      </text>

      <defs>
        <linearGradient id="logo_gradiente" x1="5" y1="8" x2="55" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1E293B"/>
          <stop offset="1" stop-color="#0F172A"/>
        </linearGradient>
      </defs>
    </svg>
    <p class="header-sub">Levantamento e Pesquisa Independente de Intenção de Voto</p>
  </div>

  <!-- Seleção do Estado -->
  <div class="seletor-card">
    <label for="uf">📍 Selecione seu Estado para Votar:</label>
    <select id="uf" onchange="selecionarEstado()">
      <option value="">-- Escolha o seu Estado --</option>
      <option value="AC">Acre</option><option value="AL">Alagoas</option><option value="AP">Amapá</option>
      <option value="AM">Amazonas</option><option value="BA">Bahia</option><option value="CE">Ceará</option>
      <option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option><option value="GO">Goiás</option>
      <option value="MA">Maranhão</option><option value="MT">Mato Grosso</option><option value="MS">Mato Grosso do Sul</option>
      <option value="MG">Minas Gerais</option><option value="PA">Pará</option><option value="PB">Paraíba</option>
      <option value="PR">Paraná</option><option value="PE">Pernambuco</option><option value="PI">Piauí</option>
      <option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option><option value="RS">Rio Grande do Sul</option>
      <option value="RO">Rondônia</option><option value="RR">Roraima</option><option value="SC">Santa Catarina</option>
      <option value="SP">São Paulo</option><option value="SE">Sergipe</option><option value="TO">Tocantins</option>
    </select>
  </div>

  <!-- Urna -->
  <div class="urna-container">
    <div class="tela-container" id="tela">
      <div>
        <div class="tela-header">Seu voto para</div>
        <div class="cargo-titulo" id="cargo">PRESIDENTE</div>
        <div class="digitos-box" id="digitos"></div>
        <div class="info-candidato" id="info"></div>
      </div>
      <div class="foto-candidato" id="foto"></div>
      <div class="instrucoes">
        Aperte a tecla:<br/>
        <strong>CONFIRMA</strong> para CONFIRMAR este voto<br/>
        <strong>CORRIGE</strong> para REINICIAR este voto
      </div>
    </div>

    <div class="teclado-container">
      <div class="teclado-header">Justiça Eleitoral</div>
      <div class="teclado-numerico">
        <button class="btn-num" onclick="inserirNumero('1')">1</button>
        <button class="btn-num" onclick="inserirNumero('2')">2</button>
        <button class="btn-num" onclick="inserirNumero('3')">3</button>
        <button class="btn-num" onclick="inserirNumero('4')">4</button>
        <button class="btn-num" onclick="inserirNumero('5')">5</button>
        <button class="btn-num" onclick="inserirNumero('6')">6</button>
        <button class="btn-num" onclick="inserirNumero('7')">7</button>
        <button class="btn-num" onclick="inserirNumero('8')">8</button>
        <button class="btn-num" onclick="inserirNumero('9')">9</button>
        <button class="btn-num" style="grid-column: 2;" onclick="inserirNumero('0')">0</button>
      </div>
      <div class="teclado-acoes">
        <button class="btn-acao btn-branco" onclick="votarBranco()">Branco</button>
        <button class="btn-acao btn-corrige" onclick="corrigir()">Corrige</button>
        <button class="btn-acao btn-confirma" onclick="confirmar()">Confirma</button>
      </div>
    </div>
  </div>

  <!-- Painel de Apuração -->
  <div class="painel-apuracao">
    <div class="painel-header">
      <h2>📊 Resultado Geral da Apuração</h2>
      <span style="font-size: 14px; color: var(--text-muted);">Total de votos: <strong id="total-votos" style="color: #fff;">0</strong></span>
    </div>
    
    <div>
      <!-- Candidato Flávio -->
      <div class="candidato-linha">
        <div class="candidato-info-flex">
          <span>🔵 Flávio Bolsonaro (22)</span>
          <span><strong id="votos-22">0</strong> votos (<span id="perc-22">0%</span>)</span>
        </div>
        <div class="barra-bg">
          <div class="barra-fill fill-flavio" id="barra-22" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Candidato Lula -->
      <div class="candidato-linha">
        <div class="candidato-info-flex">
          <span>🔴 Lula (13)</span>
          <span><strong id="votos-13">0</strong> votos (<span id="perc-13">0%</span>)</span>
        </div>
        <div class="barra-bg">
          <div class="barra-fill fill-lula" id="barra-13" style="width: 0%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Imagens dinâmicas geradas em SVG (vetoriais)
    const imgFlavio = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 135'><rect width='110' height='135' fill='%231E293B'/><circle cx='55' cy='48' r='24' fill='%233B82F6'/><path d='M20 120C20 90 35 78 55 78C75 78 90 90 90 120V135H20V120Z' fill='%233B82F6'/><text x='55' y='128' font-family='sans-serif' font-weight='bold' font-size='12' fill='%23FFFFFF' text-anchor='middle'>FL%C3%81VIO (22)</text></svg>";

    const imgLula = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 135'><rect width='110' height='135' fill='%231E293B'/><circle cx='55' cy='48' r='24' fill='%23EF4444'/><path d='M20 120C20 90 35 78 55 78C75 78 90 90 90 120V135H20V120Z' fill='%23EF4444'/><text x='55' y='128' font-family='sans-serif' font-weight='bold' font-size='12' fill='%23FFFFFF' text-anchor='middle'>LULA (13)</text></svg>";

    const candidatos = {
      "22": { nome: "Flávio Bolsonaro", partido: "PL", fotoUrl: imgFlavio },
      "13": { nome: "Luiz Inácio Lula da Silva", partido: "PT", fotoUrl: imgLula }
    };

    let numeroDigitado = "";
    let eBranco = false;
    let estadoSelecionado = "";
    let jaVotou = localStorage.getItem("jaVotouSimulador");

    // Sistema de Áudio da Urna Eletrônica
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function somTecla() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1250, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    function somPirililili() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.2, now);

      osc.frequency.setValueAtTime(520, now);
      osc.frequency.setValueAtTime(660, now + 0.08);
      osc.frequency.setValueAtTime(880, now + 0.16);
      osc.frequency.setValueAtTime(1040, now + 0.24);
      osc.frequency.setValueAtTime(1320, now + 0.32);
      osc.frequency.setValueAtTime(1760, now + 0.40);
      osc.frequency.setValueAtTime(2100, now + 0.48);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.1);
    }

    let votosGerais = JSON.parse(localStorage.getItem("votosGerais")) || { "22": 0, "13": 0, "outros": 0, "total": 0 };

    function selecionarEstado() {
      estadoSelecionado = document.getElementById("uf").value;
    }

    function atualizarTela() {
      const digitosEl = document.getElementById("digitos");
      const infoEl = document.getElementById("info");
      const fotoEl = document.getElementById("foto");
      digitosEl.innerHTML = "";

      if (eBranco) {
        infoEl.innerHTML = "<br/><strong>VOTO EM BRANCO</strong>";
        fotoEl.style.display = "none";
        fotoEl.innerHTML = "";
        return;
      }

      for (let i = 0; i < 2; i++) {
        const char = numeroDigitado[i] || "";
        digitosEl.innerHTML += `<div class="digito">${char}</div>`;
      }

      if (numeroDigitado.length === 2) {
        if (candidatos[numeroDigitado]) {
          const cand = candidatos[numeroDigitado];
          infoEl.innerHTML = `Nome: <strong>${cand.nome}</strong><br/>Partido: <strong>${cand.partido}</strong>`;
          fotoEl.innerHTML = `<img src="${cand.fotoUrl}" alt="${cand.nome}">`;
          fotoEl.style.display = "block";
        } else {
          infoEl.innerHTML = "<br/><strong>VOTO NULO</strong>";
          fotoEl.style.display = "none";
          fotoEl.innerHTML = "";
        }
      } else {
        infoEl.innerHTML = "";
        fotoEl.style.display = "none";
        fotoEl.innerHTML = "";
      }
    }

    function inserirNumero(n) {
      if (!estadoSelecionado) { alert("Por favor, selecione seu estado primeiro!"); return; }
      if (jaVotou) { alert("Você já registrou seu voto neste dispositivo!"); return; }
      if (eBranco || numeroDigitado.length >= 2) return;
      somTecla();
      numeroDigitado += n;
      atualizarTela();
    }

    function votarBranco() {
      if (!estadoSelecionado) { alert("Por favor, selecione seu estado primeiro!"); return; }
      if (jaVotou) { alert("Você já registrou seu voto neste dispositivo!"); return; }
      somTecla();
      eBranco = true;
      numeroDigitado = "";
      atualizarTela();
    }

    function corrigir() {
      if (jaVotou) return;
      somTecla();
      numeroDigitado = "";
      eBranco = false;
      atualizarTela();
    }

    function confirmar() {
      if (!estadoSelecionado) { alert("Selecione seu estado antes de confirmar!"); return; }
      if (jaVotou) { alert("Você já registrou seu voto neste dispositivo!"); return; }

      if (eBranco || numeroDigitado.length === 2) {
        somPirililili();

        if (candidatos[numeroDigitado]) {
          votosGerais[numeroDigitado]++;
        } else {
          votosGerais["outros"]++;
        }
        votosGerais["total"]++;

        localStorage.setItem("jaVotouSimulador", "true");
        localStorage.setItem("votosGerais", JSON.stringify(votosGerais));
        jaVotou = true;

        document.getElementById("tela").innerHTML = `<div class="fim-screen">FIM</div>`;
        atualizarApuracao();
      }
    }

    function atualizarApuracao() {
      const total = votosGerais.total || 0;
      const v22 = votosGerais["22"];
      const v13 = votosGerais["13"];

      const p22 = total > 0 ? ((v22 / total) * 100).toFixed(1) : "0.0";
      const p13 = total > 0 ? ((v13 / total) * 100).toFixed(1) : "0.0";

      document.getElementById("total-votos").innerText = total;
      document.getElementById("votos-22").innerText = v22;
      document.getElementById("perc-22").innerText = p22 + "%";
      document.getElementById("barra-22").style.width = p22 + "%";

      document.getElementById("votos-13").innerText = v13;
      document.getElementById("perc-13").innerText = p13 + "%";
      document.getElementById("barra-13").style.width = p13 + "%";
    }

    atualizarTela();
    atualizarApuracao();
  </script>
</body>
</html>
